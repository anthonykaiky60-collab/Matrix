<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>PARALEGUALS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--or:#FD6F2F;--cr:#FFEAD1;--lg:#DCE4B8;--dg:#076E3C;--tx:#1f2a1f;--card:#fffaf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cr);color:var(--tx);font:15px/1.5 Inter,system-ui,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;transition:.18s}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--dg);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;font-size:18px;cursor:pointer;background:none;color:#fff}
.logo i{font-style:normal;background:var(--or);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:18px}
.sb{flex:1;max-width:520px;margin:0 auto;position:relative}
.sb input{width:100%;padding:11px 16px;border-radius:14px;border:2px solid transparent;font:inherit;background:var(--cr)}
.sb input:focus{outline:0;border-color:var(--or)}
.hb{background:rgba(255,255,255,.12);color:#fff;border-radius:12px;width:40px;height:40px;font-size:17px}
.hb:hover{background:var(--or);transform:translateY(-2px)}
#burger{display:none}
.wrap{display:flex;min-height:calc(100vh - 62px)}
aside{width:220px;background:var(--dg);padding:14px 10px;flex-shrink:0;position:sticky;top:62px;height:calc(100vh - 62px)}
aside button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:4px;border-radius:12px;background:none;color:#e9f3e4}
aside button:hover,aside button.on{background:var(--or);color:var(--tx);font-weight:700}
main{flex:1;padding:26px;max-width:1150px;margin:0 auto;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1,h2,h3{color:var(--dg);margin:0 0 8px}h1{font-size:30px}
.crumb{font-size:13px;margin-bottom:14px;color:var(--dg)}.crumb a{cursor:pointer;text-decoration:underline}
.hero{background:var(--lg);border-radius:24px;padding:30px;margin-bottom:22px;box-shadow:0 8px 24px rgba(7,110,60,.1)}
.hero p{margin:4px 0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:24px}
.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.stat b{display:block;font-size:26px;color:var(--dg)}.stat span{font-size:13px}
.folder{background:var(--card);border-radius:22px;padding:20px;text-align:left;box-shadow:0 4px 14px rgba(7,110,60,.1);border-top:6px solid var(--or);position:relative;overflow:hidden}
.folder:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(7,110,60,.2)}
.folder .ic{font-size:40px;display:block;transition:.2s}.folder:hover .ic{transform:scale(1.15) rotate(-6deg)}
.folder h3{margin-top:8px}.folder small{color:#4a5a4a;display:block;min-height:40px}
.tag{display:inline-block;background:var(--lg);color:var(--dg);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-top:8px}
.uf{background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.06);color:var(--tx)}
.uf:hover{background:var(--lg);transform:translateY(-3px)}.uf b{color:var(--or);font-size:20px;display:block}
.sv{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:6px;transition:.2s}
.sv:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(7,110,60,.15)}
.sv .t{display:flex;justify-content:space-between;align-items:start;gap:8px}.sv .e{font-size:26px}
.sv h4{margin:0;color:var(--dg)}.sv p{margin:0;font-size:13px;color:#4a5a4a;flex:1}
.star{background:none;font-size:22px;color:var(--or)}.star.on{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.5)}}
.go{background:var(--or);color:var(--tx);font-weight:800;border-radius:12px;padding:10px 14px;text-align:center;text-decoration:none;display:block;min-height:42px}
.go:hover{background:var(--dg);color:#fff;transform:translateX(3px)}
.go.off{background:#e6dccb;color:#7a6f60;pointer-events:none}
.grp{margin:18px 0 8px;font-size:17px;color:var(--dg);border-bottom:2px solid var(--lg);padding-bottom:4px}
.row{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
form{background:var(--card);border-radius:20px;padding:20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:20px}
label{font-size:13px;font-weight:700;color:var(--dg);display:flex;flex-direction:column;gap:4px}
input,select,textarea{padding:10px;border-radius:10px;border:1.5px solid #cfc3ae;font:inherit;background:#fff}
.btn{background:var(--or);color:var(--tx);font-weight:800;border-radius:12px;padding:11px 18px}.btn:hover{background:var(--dg);color:#fff}
.btn.s{background:var(--lg);color:var(--dg);padding:6px 12px;font-size:13px}
.spin{width:30px;height:30px;border:4px solid var(--lg);border-top-color:var(--or);border-radius:50%;animation:r .7s linear infinite;margin:40px auto}@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:820px){#burger{display:block}aside{position:fixed;left:0;top:62px;transform:translateX(-100%);z-index:30;transition:.25s}aside.open{transform:none}main{padding:16px}.hb.x{display:none}h1{font-size:24px}.logo span{display:none}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--cr:#FFEAD1}}
</style><style>
/* tema empresarial */
body{font-family:"Segoe UI",Inter,system-ui,Roboto,sans-serif;font-size:14.5px;background:#f6efe2}

.folder{border-top:0;border-left:5px solid #076E3C;padding:20px 22px}

.arr{display:block;margin-top:10px;font-size:13px;font-weight:700;color:#FD6F2F;opacity:0;transform:translateX(-6px);transition:.2s}.folder:hover .arr{opacity:1;transform:none}

</style></head><body>
<header><button class="hb" id="burger" data-a="menu">☰</button>
<button class="logo" data-go="home"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f2a1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 14l2.2 2.2L15.5 11.5"/></svg></i><span>PARALEGUALS</span></button>
<div class="sb"><input id="q" placeholder="O que você precisa acessar?" aria-label="Pesquisar"></div>
<button class="hb x" data-go="fav" title="Favoritos">⭐</button><button class="hb x" data-go="cfg" title="Configurações">⚙️</button><button class="hb" data-go="admin" title="Perfil / Admin">👤</button></header>
<div class="wrap"><aside id="sb"></aside><main id="m"></main></div>
<script>
/* ===== DADOS (separados da interface) ===== */
const UFS="AC:Acre,AL:Alagoas,AP:Amapá,AM:Amazonas,BA:Bahia,CE:Ceará,DF:Distrito Federal,ES:Espírito Santo,GO:Goiás,MA:Maranhão,MT:Mato Grosso,MS:Mato Grosso do Sul,MG:Minas Gerais,PA:Pará,PB:Paraíba,PR:Paraná,PE:Pernambuco,PI:Piauí,RJ:Rio de Janeiro,RN:Rio Grande do Norte,RS:Rio Grande do Sul,RO:Rondônia,RR:Roraima,SC:Santa Catarina,SP:São Paulo,SE:Sergipe,TO:Tocantins".split(",").map(s=>s.split(":"));
/* municipios/: adicione novos aqui (ou pelo Admin) */
const MUNS={SP:["São Paulo","São Caetano do Sul","Santo André","São Bernardo do Campo","Campinas","Guarulhos","Osasco"],RJ:["Rio de Janeiro","Niterói"],MG:["Belo Horizonte","Uberlândia"]};
/* services/estadual: modelo aplicado a cada UF. URLs só onde são oficiais conhecidas */
const ET=[["Governo Estadual","Portal do Governo","Site oficial do governo estadual","🏛️"],["Governo Estadual","Secretaria da Fazenda","SEFAZ / Fazenda estadual","💼"],["Governo Estadual","Secretaria da Administração","Administração estadual","🗂️"],["Governo Estadual","Junta Comercial","Registro empresarial","🏢"],["Governo Estadual","PGE — Procuradoria-Geral do Estado","Procuradoria e dívida ativa","⚖️"],["Certidões","Certidão Negativa de Débitos","Certidão estadual","📄"],["Certidões","Certidão de Dívida Ativa","Certidão de dívida ativa","📄"],["Certidões","Consulta de Débitos","Débitos estaduais","🔎"],["Fiscal","Consulta de Inscrição Estadual","Consulta de IE","🔎"],["Fiscal","Posto Fiscal","Atendimento fiscal","🧾"],["Fiscal","Emissão de documentos fiscais","Serviços tributários","🧾"],["Empresarial","Consulta de empresas CNPJ/IE","Consulta de empresas","🏭"],["Empresarial","Alterações cadastrais e registro","Registro empresarial","✏️"]];
/* services/municipal: modelo aplicado a cada município */
const MT=[["Prefeitura","Portal da Prefeitura","Site oficial","🏙️"],["Prefeitura","Serviços Online","Serviços ao cidadão","💻"],["Prefeitura","Portal do Contribuinte","Área do contribuinte","👤"],["Certidões","Certidão Negativa de Débitos","Certidão municipal","📄"],["Certidões","Certidão de Tributos","Certidão de tributos","📄"],["Fiscal","ISS","Imposto sobre Serviços","🧾"],["Fiscal","TFE / TFA","Taxas de fiscalização","🧾"],["Fiscal","TRSS","Taxa de resíduos","🧾"],["Fiscal","DUC","Documento único de cobrança","🧾"],["Fiscal","NFS-e","Nota Fiscal de Serviço","🧾"],["Empresas","Inscrição Municipal","Cadastro mobiliário","🏢"],["Empresas","Alvará e Licenciamento","Alvará de funcionamento","📜"]];
/* URLs oficiais conhecidas (chave: UF|serviço ou UF|município|serviço). Vazio = cadastrar depois */
const KU={"SP|Portal do Governo":"https://www.sp.gov.br","SP|Secretaria da Fazenda":"https://portal.fazenda.sp.gov.br","SP|Junta Comercial":"https://www.jucesp.sp.gov.br","SP|PGE — Procuradoria-Geral do Estado":"https://www.pge.sp.gov.br","SP|São Paulo|Portal da Prefeitura":"https://prefeitura.sp.gov.br","SP|São Caetano do Sul|Portal da Prefeitura":"https://www.saocaetanodosul.sp.gov.br","RJ|Rio de Janeiro|Portal da Prefeitura":"https://prefeitura.rio","MG|Belo Horizonte|Portal da Prefeitura":"https://prefeitura.pbh.gov.br"};
/* services/federal, fiscal, outros: [escopo,grupo,nome,desc,emoji,url] */
const F=[["federal","Receita Federal","Receita Federal","Portal institucional","🏛️","https://www.gov.br/receitafederal"],["federal","Receita Federal","e-CAC","Centro virtual de atendimento","🔐","https://cav.receita.fazenda.gov.br"],["federal","Receita Federal","Consulta CNPJ / Comprovante de Inscrição","Situação cadastral","🔎","https://solucoes.receita.fazenda.gov.br/servicos/cnpjreva/cnpjreva_solicitacao.asp"],["federal","Receita Federal","Simples Nacional","Portal do Simples","📊","https://www8.receita.fazenda.gov.br/SimplesNacional"],["federal","PGFN","Regularize","Dívida ativa, parcelamentos e negociação","🤝","https://www.regularize.pgfn.gov.br"],["federal","Governo Federal","Gov.br","Portal de serviços","🇧🇷","https://www.gov.br"],["federal","Empresas & Negócios","Portal do Empreendedor","MEI e empresas","🚀","https://www.gov.br/empresas-e-negocios"],["federal","Trabalhista","eSocial","Portal eSocial","👷","https://www.gov.br/esocial"],["federal","Trabalhista","FGTS / Caixa — Regularidade","Certificado de Regularidade","🏦","https://consulta-crf.caixa.gov.br"],["federal","Previdenciário","Meu INSS","Serviços previdenciários","🧓","https://meu.inss.gov.br"],
["fiscal","Notas Fiscais","Portal Nacional da NF-e","NF-e e DANFE","🧾","https://www.nfe.fazenda.gov.br"],["fiscal","Notas Fiscais","NFS-e Nacional","Nota Fiscal de Serviço Eletrônica","🧾","https://www.nfse.gov.br"],["fiscal","Notas Fiscais","Nota do Milhão (SP capital)","Programa da Prefeitura de São Paulo","🎁","https://notadomilhao.prefeitura.sp.gov.br"],["fiscal","Notas Fiscais","NFC-e","Cadastre o link da sua SEFAZ","🧾",""],["fiscal","Transporte","Portal do CT-e","Conhecimento de Transporte Eletrônico","🚚","https://www.cte.fazenda.gov.br"],["fiscal","Transporte","MDF-e","Manifesto de Documentos Fiscais","🚛",""],["fiscal","Consultas","Consulta NF-e / DANFE por chave","Chave de acesso","🔑","https://www.nfe.fazenda.gov.br"],["fiscal","Tributação","Simples Nacional","Portal tributário","📊","https://www8.receita.fazenda.gov.br/SimplesNacional"],["fiscal","Tributação","PGFN","Procuradoria da Fazenda Nacional","⚖️","https://www.gov.br/pgfn"],
["outros","Outros","Exemplo: cadastre aqui","Use o ADMIN para adicionar serviços","➕",""]];
const CATS={federal:["Federal","📁","Órgãos e serviços do Governo Federal"],estadual:["Estadual","📁","Portais e serviços dos governos estaduais"],municipal:["Municipal","📁","Prefeituras, certidões e serviços municipais"],fiscal:["Fiscal","📁","Notas fiscais, documentos fiscais e consultas"],outros:["Outros Serviços","📁","Demais serviços e portais úteis"]};
function gen(){let a=[],n=0;const add=(o)=>a.push({id:"s"+(++n),active:true,feat:false,uf:"",mun:"",...o});
F.forEach(f=>add({scope:f[0],cat:f[1],name:f[2],desc:f[3],icon:f[4],url:f[5]}));
UFS.forEach(([u])=>ET.forEach(t=>add({scope:"estadual",uf:u,cat:t[0],name:t[1],desc:t[2],icon:t[3],url:KU[u+"|"+t[1]]||""})));
["SP","RJ","MG"].forEach(u=>MUNS[u].forEach(m=>MT.forEach(t=>add({scope:"municipal",uf:u,mun:m,cat:t[0],name:t[1],desc:t[2],icon:t[3],url:KU[u+"|"+m+"|"+t[1]]||""}))));return a}
/* ===== ESTADO ===== */
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let SV=L("pl_sv",null)||gen(),FAV=L("pl_fav",[]),HIST=L("pl_hist",[]),V={v:"home"},EDIT=null;
const sv=()=>S("pl_sv",SV),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const act=()=>SV.filter(s=>s.active);
const munsOf=u=>[...new Set([...(MUNS[u]||[]),...SV.filter(s=>s.scope=="municipal"&&s.uf==u).map(s=>s.mun)])].sort((a,b)=>a.localeCompare(b));
const nMun=()=>UFS.reduce((t,[u])=>t+munsOf(u).length,0);
const uname=u=>(UFS.find(x=>x[0]==u)||[])[1]||u;
/* ===== COMPONENTES ===== */
const svc=s=>`<div class="sv"><div class="t"><span class="e">${esc(s.icon)}</span><button class="star ${FAV.includes(s.id)?"on":""}" data-fav="${s.id}" aria-label="Favoritar">${FAV.includes(s.id)?"★":"☆"}</button></div><h4>${esc(s.name)}</h4><p>${esc(s.desc)}${s.uf?` · ${s.mun?esc(s.mun)+"/":""}${s.uf}`:""}</p>${s.url?`<a class="go" href="${esc(s.url)}" target="_blank" rel="noopener" data-open="${s.id}">ACESSAR →</a>`:`<span class="go off">Link pendente</span>`}</div>`;
const groups=l=>{const g={};l.forEach(s=>(g[s.cat]=g[s.cat]||[]).push(s));return Object.entries(g).map(([k,v])=>`<h3 class="grp">${esc(k)}</h3><div class="grid">${v.map(svc).join("")}</div>`).join("")||"<p>Nenhum serviço encontrado.</p>"};
const crumb=a=>`<div class="crumb">${a.map(([t,g])=>g?`<a data-go="${g}">${t}</a>`:t).join(" › ")}</div>`;
const folder=(k,n)=>`<button class="folder" data-go="${k}"><span class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#076E3C" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#DCE4B8"/><path d="M9 13l2.2 2.2L15.5 11" stroke="#FD6F2F" stroke-width="2" stroke-linecap="round"/></svg></span><h3>${CATS[k][0].toUpperCase()}</h3><small>${CATS[k][2]}</small><span class="tag">${n} serviços</span><span class="arr">Abrir →</span></button>`;
const cnt=k=>act().filter(s=>s.scope==k).length;
const when=t=>{const d=new Date(t),h=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),df=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return(df==0?"Hoje":df==1?"Ontem":d.toLocaleDateString("pt-BR"))+" — "+h};
/* ===== VIEWS ===== */
const views={
home:()=>`<div class="hero"><small>CENTRAL DE PORTAIS · PARALEGAL · CONTABILIDADE · FISCAL</small><h1>Todos os portais que você precisa em um só lugar.</h1><p>Encontre rapidamente serviços estaduais, municipais, federais e fiscais.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-go="federal">Explorar serviços</button><button class="btn s" data-go="fav" style="background:rgba(255,255,255,.15);color:#fff">Meus favoritos</button></div></div>
<div class="grid stats"><div class="stat"><b>27</b><span>Estados</span></div><div class="stat"><b>${nMun()}</b><span>Municípios cadastrados (meta 5.570)</span></div><div class="stat"><b>${act().length}</b><span>Serviços</span></div><div class="stat"><b>${FAV.length}</b><span>Favoritos</span></div><div class="stat"><b>${HIST.length}</b><span>Acessos recentes</span></div></div>
<div class="grid">${["estadual","municipal","federal","fiscal","outros"].map(k=>folder(k,cnt(k))).join("")}</div>
<h2 class="grp" style="font-size:18px">Últimos acessos</h2>${hist(4)}`,
estadual:()=>crumb([["Início","home"],["Estadual"]])+`<h1>Estadual</h1><div class="grid">${UFS.map(([u,n])=>`<button class="uf" data-go="uf:${u}"><b>${u}</b>${n}</button>`).join("")}</div>`,
uf:()=>crumb([["Início","home"],["Estadual","estadual"],[uname(V.a)]])+`<h1>${uname(V.a)}</h1>${groups(act().filter(s=>s.scope=="estadual"&&s.uf==V.a))}`,
municipal:()=>crumb([["Início","home"],["Municipal"]])+`<h1>Municipal</h1><p>Escolha o estado:</p><div class="grid">${UFS.map(([u,n])=>`<button class="uf" data-go="mu:${u}"><b>${u}</b>${n}<br><small>${munsOf(u).length} municípios</small></button>`).join("")}</div>`,
mu:()=>{const l=munsOf(V.a);return crumb([["Início","home"],["Municipal","municipal"],[uname(V.a)]])+`<h1>${uname(V.a)}</h1><div class="sb" style="max-width:100%;margin:0 0 16px"><input id="mf" placeholder="🔎 Pesquisar município" style="border:2px solid var(--lg)"></div><div class="grid" id="ml">${mlist(l)}</div>${l.length?"":"<p>Nenhum município cadastrado ainda. Use o ADMIN para adicionar.</p>"}`},
mun:()=>crumb([["Início","home"],["Municipal","municipal"],[uname(V.a),"mu:"+V.a],[V.b]])+`<h1>${esc(V.b)}</h1>${groups(act().filter(s=>s.scope=="municipal"&&s.uf==V.a&&s.mun==V.b))}`,
federal:()=>crumb([["Início","home"],["Federal"]])+`<h1>Federal</h1>${groups(act().filter(s=>s.scope=="federal"))}`,
fiscal:()=>crumb([["Início","home"],["Fiscal"]])+`<h1>Fiscal</h1>${groups(act().filter(s=>s.scope=="fiscal"))}`,
outros:()=>crumb([["Início","home"],["Outros"]])+`<h1>Outros Serviços</h1>${groups(act().filter(s=>s.scope=="outros"))}`,
fav:()=>`<h1>⭐ Meus Favoritos</h1>${FAV.length?`<div class="grid">${act().filter(s=>FAV.includes(s.id)).map(svc).join("")}</div>`:"<p>Clique na ☆ de qualquer serviço para favoritar.</p>"}`,
hist:()=>`<h1>🕘 Últimos acessos</h1>${hist(50)}<button class="btn s" data-a="clh">Limpar histórico</button>`,
cfg:()=>`<h1>⚙️ Configurações</h1><div class="row"><span>Dados salvos neste navegador (serviços, favoritos, histórico).</span><button class="btn s" data-a="reset">Restaurar dados de demonstração</button></div><div class="row"><span>Serviços sem URL aparecem como "Link pendente" até você cadastrar o link oficial no ADMIN.</span></div>`,
search:()=>{const q=V.a.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const r=act().filter(s=>(s.name+" "+s.desc+" "+s.cat+" "+s.mun+" "+uname(s.uf)+" "+s.uf+" "+s.scope).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q));return`<h1>🔍 Resultados para "${esc(V.a)}"</h1><p>${r.length} serviço(s)</p><div class="grid">${r.slice(0,80).map(svc).join("")}</div>`},
admin:()=>{const e=EDIT?SV.find(s=>s.id==EDIT):null,v=e||{scope:"federal",active:true,icon:"🔗"};return`<h1>ADMIN PARALEGUALS</h1><form id="af"><label>Nome do serviço<input name="name" required value="${esc(v.name)}"></label><label>Categoria (pasta)<select name="scope">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${v.scope==k?"selected":""}>${c[0]}</option>`).join("")}</select></label><label>Grupo / subcategoria<input name="cat" value="${esc(v.cat||"")}" placeholder="ex.: Certidões"></label><label>Estado<select name="uf"><option value="">—</option>${UFS.map(([u,n])=>`<option value="${u}" ${v.uf==u?"selected":""}>${u} — ${n}</option>`).join("")}</select></label><label>Município<input name="mun" value="${esc(v.mun||"")}"></label><label>Ícone (emoji)<input name="icon" value="${esc(v.icon)}"></label><label>URL oficial<input name="url" type="url" placeholder="https://" value="${esc(v.url||"")}"></label><label>Status<select name="active"><option value="1">Ativo</option><option value="0" ${v.active?"":"selected"}>Inativo</option></select></label><label>Destaque<select name="feat"><option value="0">Não</option><option value="1" ${v.feat?"selected":""}>Sim</option></select></label><label style="grid-column:1/-1">Descrição<textarea name="desc">${esc(v.desc||"")}</textarea></label><button class="btn">SALVAR SERVIÇO</button></form>
<h3>Serviços cadastrados</h3><div class="sb" style="max-width:100%;margin:0 0 10px"><input id="af2" placeholder="Filtrar por nome, estado ou município" value="${esc(V.q||"")}" style="border:2px solid var(--lg)"></div>${SV.filter(s=>!V.q||(s.name+s.uf+s.mun).toLowerCase().includes(V.q.toLowerCase())).slice(0,40).map(s=>`<div class="row"><span>${esc(s.icon)} <b>${esc(s.name)}</b> <small>${s.uf?s.uf+" ":""}${esc(s.mun)} · ${CATS[s.scope][0]} ${s.active?"":"(inativo)"} ${s.url?"":"· sem URL"}</small></span><span><button class="btn s" data-edit="${s.id}">Editar</button> <button class="btn s" data-del="${s.id}">Excluir</button></span></div>`).join("")}`}};
const mlist=l=>l.map(m=>`<button class="uf" data-go="mun:${V.a}:${esc(m)}">${esc(m)}</button>`).join("");
function hist(n){return HIST.length?HIST.slice(0,n).map(h=>`<div class="row"><span>${esc(h.name)}</span><span>${when(h.t)}</span></div>`).join(""):"<p>Nenhum acesso ainda.</p>"}
/* ===== RENDER / NAV ===== */
const NAV=[["home","🏠","Início"],["estadual","📁","Estadual"],["municipal","📁","Municipal"],["federal","📁","Federal"],["fiscal","📁","Fiscal"],["outros","📁","Outros"],["fav","⭐","Favoritos"],["hist","🕘","Histórico"],["cfg","⚙️","Configurações"],["admin","🛠️","Admin"]];
function render(){const root=V.v=="uf"?"estadual":V.v=="mu"||V.v=="mun"?"municipal":V.v;$("#sb").innerHTML=NAV.map(([k,i,t])=>`<button data-go="${k}" class="${root==k?"on":""}">${t}</button>`).join("");
$("#m").innerHTML='<div class="spin"></div>';setTimeout(()=>{$("#m").innerHTML=views[V.v]();$("#m").style.animation="none";$("#m").offsetHeight;$("#m").style.animation="";scrollTo(0,0)},120)}
function go(g){$("#sb").classList.remove("open");const[p,a,b]=g.split(":");V={v:p,a,b};render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-fav],[data-open],[data-a],[data-edit],[data-del]");if(!t)return;const d=t.dataset;
if(d.go)go(d.go);
else if(d.fav){FAV=FAV.includes(d.fav)?FAV.filter(x=>x!=d.fav):[...FAV,d.fav];S("pl_fav",FAV);const on=FAV.includes(d.fav);t.textContent=on?"★":"☆";t.classList.toggle("on",on)}
else if(d.open){const s=SV.find(x=>x.id==d.open);HIST=[{name:s.name+(s.mun?" — "+s.mun:s.uf?" — "+s.uf:""),t:Date.now()},...HIST].slice(0,50);S("pl_hist",HIST)}
else if(d.a=="menu")$("#sb").classList.toggle("open");
else if(d.a=="clh"){HIST=[];S("pl_hist",HIST);render()}
else if(d.a=="reset"&&confirm("Restaurar dados de demonstração?")){SV=gen();FAV=[];HIST=[];sv();S("pl_fav",[]);S("pl_hist",[]);render()}
else if(d.edit){EDIT=d.edit;render();setTimeout(()=>scrollTo(0,0),200)}
else if(d.del&&confirm("Excluir este serviço?")){SV=SV.filter(s=>s.id!=d.del);sv();render()}});
document.addEventListener("submit",e=>{if(e.target.id!="af")return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
const o={name:f.name,scope:f.scope,cat:f.cat||"Geral",uf:f.uf,mun:f.mun,icon:f.icon||"🔗",url:f.url,desc:f.desc,active:f.active=="1",feat:f.feat=="1"};
if(EDIT)Object.assign(SV.find(s=>s.id==EDIT),o);else SV.push({id:"u"+Date.now(),...o});EDIT=null;sv();render()});
document.addEventListener("input",e=>{if(e.target.id=="q"){const v=e.target.value.trim();if(v.length>1){V={v:"search",a:v};$("#m").innerHTML=views.search()}else if(!v)go("home")}
if(e.target.id=="mf"){const q=e.target.value.toLowerCase();$("#ml").innerHTML=mlist(munsOf(V.a).filter(m=>m.toLowerCase().includes(q)))}
if(e.target.id=="af2"){V.q=e.target.value;const p=e.target.selectionStart;render();setTimeout(()=>{const i=$("#af2");if(i){i.focus();i.setSelectionRange(p,p)}},200)}});
render();
</script></body></html>
